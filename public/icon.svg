<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E5E4D"/>
      <stop offset="1" stop-color="#243A2F"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4ECE0"/>
      <stop offset="1" stop-color="#EBDFCB"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 行李标签卡片 -->
  <rect x="116" y="156" width="280" height="220" rx="24" fill="url(#tag)" stroke="#D9CDB8" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- 标签穿绳孔 -->
  <circle cx="256" cy="156" r="20" fill="#243A2F"/>
  <circle cx="256" cy="156" r="10" fill="#F4ECE0"/>

  <!-- 绳子 -->
  <path d="M256 136 Q256 96 296 80" fill="none" stroke="#C8643A" stroke-width="6" stroke-linecap="round"/>

  <!-- 勾选标记 -->
  <path d="M180 268 L232 320 L332 212" fill="none" stroke="#2F4A3C" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 邮戳点缀 -->
  <g transform="translate(360 360) rotate(-12)" opacity="0.85">
    <circle r="42" fill="none" stroke="#C8643A" stroke-width="4" stroke-dasharray="4 3"/>
    <text x="0" y="6" font-family="Georgia, serif" font-size="16" fill="#C8643A" text-anchor="middle" font-weight="700">PACK</text>
  </g>
</svg>
